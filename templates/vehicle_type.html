{% extends "base.html" %}
{% block content %}

<div class="container text-center mt-5">
    <h2 class="mb-4 fw-semibold">Choose Vehicle Type</h2>

    <div class="d-flex justify-content-center gap-4 mt-3">
        {% for vehicle_type in vehicle_types %}
            <a href="{% url 'view_slots' vehicle_type.id %}" 
               class="btn btn-outline-primary btn-lg px-5">
                {% if 'CAR' in vehicle_type.name|upper %}
                    🚗
                {% else %}
                    🏍️
                {% endif %}
                {{ vehicle_type.name }}
            </a>
        {% endfor %}
    </div>
</div>

{% endblock %}
